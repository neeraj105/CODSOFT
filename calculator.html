<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blue Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e8f0fe;
      font-family: 'Nunito', sans-serif;
    }

    .calc {
      background: linear-gradient(145deg, #1a7de8, #1460c0);
      border-radius: 28px;
      padding: 24px;
      width: 300px;
      box-shadow: 0 8px 32px rgba(20,96,192,0.35), inset 0 1px 0 rgba(255,255,255,0.18);
    }

    .display-wrap {
      background: #d6eaff;
      border-radius: 12px;
      padding: 12px 16px 10px;
      margin-bottom: 20px;
      border: 2px solid rgba(255,255,255,0.5);
      min-height: 72px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .display-expr {
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      color: #1460c0;
      min-height: 16px;
      text-align: right;
      opacity: 0.7;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .display-main {
      font-family: 'Share Tech Mono', monospace;
      font-size: 32px;
      color: #0a3a80;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.1;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .btn {
      font-family: 'Nunito', sans-serif;
      font-size: 18px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      height: 58px;
      cursor: pointer;
      transition: transform 0.08s, filter 0.08s;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .btn:active { transform: scale(0.93); }

    .btn-num {
      background: #1e5fc4;
      color: #fff;
      box-shadow: 0 4px 0 #0f3d8a;
    }
    .btn-num:hover { filter: brightness(1.12); }

    .btn-op {
      background: #2471e8;
      color: #fff;
      box-shadow: 0 4px 0 #1050b5;
    }
    .btn-op:hover { filter: brightness(1.15); }

    .btn-eq {
      background: #fff;
      color: #1460c0;
      box-shadow: 0 4px 0 #b0c8f0;
      font-size: 22px;
    }
    .btn-eq:hover { filter: brightness(0.96); }

    .btn-clear {
      background: #e84040;
      color: #fff;
      box-shadow: 0 4px 0 #a82020;
      font-size: 14px;
    }
    .btn-clear:hover { filter: brightness(1.1); }

    .btn-del {
      background: #e87820;
      color: #fff;
      box-shadow: 0 4px 0 #a85510;
      font-size: 14px;
    }
    .btn-del:hover { filter: brightness(1.1); }

    .btn-zero { grid-column: span 2; }

    .btn-dot {
      background: #1e5fc4;
      color: #fff;
      box-shadow: 0 4px 0 #0f3d8a;
    }
  </style>
</head>
<body>

  <div class="calc">
    <div class="display-wrap">
      <div class="display-expr" id="expr"></div>
      <div class="display-main" id="display">0</div>
    </div>
    <div class="btn-grid">
      <button class="btn btn-clear" onclick="clearAll()">AC</button>
      <button class="btn btn-del"   onclick="deleteLast()">DEL</button>
      <button class="btn btn-op"    onclick="inputOp('%')">%</button>
      <button class="btn btn-op"    onclick="inputOp('÷')">÷</button>

      <button class="btn btn-num"   onclick="inputNum('7')">7</button>
      <button class="btn btn-num"   onclick="inputNum('8')">8</button>
      <button class="btn btn-num"   onclick="inputNum('9')">9</button>
      <button class="btn btn-op"    onclick="inputOp('×')">×</button>

      <button class="btn btn-num"   onclick="inputNum('4')">4</button>
      <button class="btn btn-num"   onclick="inputNum('5')">5</button>
      <button class="btn btn-num"   onclick="inputNum('6')">6</button>
      <button class="btn btn-op"    onclick="inputOp('−')">−</button>

      <button class="btn btn-num"   onclick="inputNum('1')">1</button>
      <button class="btn btn-num"   onclick="inputNum('2')">2</button>
      <button class="btn btn-num"   onclick="inputNum('3')">3</button>
      <button class="btn btn-op"    onclick="inputOp('+')">+</button>

      <button class="btn btn-num btn-zero" onclick="inputNum('0')">0</button>
      <button class="btn btn-dot"   onclick="inputDot()">.</button>
      <button class="btn btn-eq"    onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let current  = '0';
    let expression = '';
    let justCalc = false;

    const display = document.getElementById('display');
    const expr    = document.getElementById('expr');

    function update() {
      display.textContent = current.length > 12
        ? parseFloat(current).toExponential(4)
        : current;
      expr.textContent = expression;
    }

    function inputNum(n) {
      if (justCalc) { current = n; expression = ''; justCalc = false; }
      else if (current === '0' && n !== '.') current = n;
      else if (current.length < 14) current += n;
      update();
    }

    function inputDot() {
      if (justCalc) { current = '0.'; expression = ''; justCalc = false; }
      else if (!current.includes('.')) current += '.';
      update();
    }

    function inputOp(op) {
      justCalc = false;
      const ops = ['+', '−', '×', '÷', '%'];
      const last = expression.slice(-1);
      if (ops.includes(last)) {
        expression = expression.slice(0, -1) + op;
      } else {
        expression += current + op;
        current = '0';
      }
      update();
    }

    function clearAll() {
      current = '0'; expression = ''; justCalc = false;
      update();
    }

    function deleteLast() {
      if (justCalc) { clearAll(); return; }
      current = current.length > 1 ? current.slice(0, -1) : '0';
      update();
    }

    function calculate() {
      if (!expression) return;
      const full = expression + current;
      expr.textContent = full + '=';
      try {
        const safe = full
          .replace(/÷/g, '/')
          .replace(/×/g, '*')
          .replace(/−/g, '-')
          .replace(/(\d+(\.\d+)?)%/g, '($1/100)');
        let result = Function('"use strict"; return (' + safe + ')')();
        current = isFinite(result)
          ? String(parseFloat(result.toPrecision(12)))
          : 'Error';
      } catch(e) {
        current = 'Error';
      }
      expression = '';
      justCalc = true;
      display.textContent = current.length > 12
        ? parseFloat(current).toExponential(4)
        : current;
    }

    // Keyboard support
    document.addEventListener('keydown', e => {
      if (e.key >= '0' && e.key <= '9') inputNum(e.key);
      else if (e.key === '.') inputDot();
      else if (e.key === '+') inputOp('+');
      else if (e.key === '-') inputOp('−');
      else if (e.key === '*') inputOp('×');
      else if (e.key === '/') { e.preventDefault(); inputOp('÷'); }
      else if (e.key === '%') inputOp('%');
      else if (e.key === 'Enter' || e.key === '=') calculate();
      else if (e.key === 'Backspace') deleteLast();
      else if (e.key === 'Escape') clearAll();
    });
  </script>

</body>
</html>
